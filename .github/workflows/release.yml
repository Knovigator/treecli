name: release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to build, for example v0.1.0'
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Preserve release tooling before tag checkout
              run: |
                  mkdir -p "$RUNNER_TEMP/treecli-release-tools"
                  cp scripts/build-release.sh scripts/verify-release.sh "$RUNNER_TEMP/treecli-release-tools/"
                  chmod +x "$RUNNER_TEMP/treecli-release-tools/"*.sh

            - name: Resolve release tag
              id: release
              run: |
                  set -euo pipefail

                  tag="${GITHUB_REF_NAME}"
                  if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
                      tag="${{ inputs.tag }}"
                  fi

                  case "$tag" in
                      v*) ;;
                      *)
                          echo "treecli releases must use tags like v0.1.0" >&2
                          exit 1
                          ;;
                  esac

                  echo "tag=$tag" >> "$GITHUB_OUTPUT"

            - name: Checkout requested tag
              if: github.event_name == 'workflow_dispatch'
              env:
                  TREECLI_RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  git fetch --force origin "refs/tags/${TREECLI_RELEASE_TAG}:refs/tags/${TREECLI_RELEASE_TAG}"
                  git checkout --detach "$TREECLI_RELEASE_TAG"

            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22.x'
                  cache-dependency-path: go.sum

            - name: Test
              run: go test -mod=readonly -race -shuffle=on -count=1 ./...

            - name: Build release artifacts
              env:
                  TREECLI_VERSION: ${{ steps.release.outputs.tag }}
                  TREECLI_REPO_ROOT: ${{ github.workspace }}
              run: |
                  "$RUNNER_TEMP/treecli-release-tools/build-release.sh" "$TREECLI_VERSION"

            - name: Verify release artifacts
              env:
                  TREECLI_VERSION: ${{ steps.release.outputs.tag }}
                  TREECLI_REPO_ROOT: ${{ github.workspace }}
              run: |
                  "$RUNNER_TEMP/treecli-release-tools/verify-release.sh" "$TREECLI_VERSION"

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.release.outputs.tag }}
                  name: treecli ${{ steps.release.outputs.tag }}
                  files: dist/*
                  generate_release_notes: true
